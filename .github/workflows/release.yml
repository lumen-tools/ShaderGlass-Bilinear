name: Release

# Builds ShaderGlass.exe (Windows) and WineCap.dll (Linux/Wine) and publishes
# ShaderGlass-Bilinear-<version>-win-x64.zip with the same contents as the upstream releases.
# - Push to main that changes VERSION -> creates tag v<VERSION> + release
# - Publishing a release manually       -> attaches the zip to that release
# - "Run workflow" manually             -> (re)builds the zip for the given tag
on:
  push:
    branches: [main]
    paths: [VERSION]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)build the zip for (e.g. v1.0.2)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: microsoft/setup-msbuild@v2
    - name: Build
      run: msbuild /m /p:Configuration=Release /p:Platform=x64 ShaderGlass.sln
    - uses: actions/upload-artifact@v4
      with:
        name: exe
        path: x64\Release\ShaderGlass.exe

  build-winecap:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo mkdir -pm755 /etc/apt/keyrings && sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
        sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/jammy/winehq-jammy.sources
        sudo apt-get update
        sudo apt-get install -y libpipewire-0.3-dev libglib2.0-dev gcc g++ make
        sudo apt-get install -y --install-recommends wine-devel-dev winehq-devel
    - name: Build
      working-directory: ./WineCap
      run: make all
    - uses: actions/upload-artifact@v4
      with:
        name: winecap
        path: ./WineCap/WineCap.dll

  publish:
    needs: [build-windows, build-winecap]
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Determine tag and version
      id: ver
      run: |
        case "${{ github.event_name }}" in
          release)           TAG="${{ github.event.release.tag_name }}" ;;
          workflow_dispatch) TAG="${{ inputs.tag }}" ;;
          *)                 TAG="v$(tr -d '[:space:]' < VERSION)" ;;
        esac
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    - name: Package (same layout as upstream ShaderGlass-x.y.z-win-x64.zip)
      run: |
        V="${{ steps.ver.outputs.version }}"
        mkdir dist
        cp artifacts/exe/ShaderGlass.exe artifacts/winecap/WineCap.dll Misc/MANUAL.pdf dist/
        crlf() { sed 's/\r$//; s/$/\r/' "$1" > "$2"; }
        crlf LICENSE dist/LICENSE
        crlf Misc/CustomShader.slang dist/CustomShader.slang
        { echo "ShaderGlass-Bilinear v$V (based on ShaderGlass v1.3.2 by mausimus, with Bilinear Filter)"; echo "https://github.com/lumen-tools/ShaderGlass-Bilinear"; tail -n +2 Misc/README.txt; } > readme.tmp
        crlf readme.tmp dist/README.txt
        (cd dist && zip -X -9 "../ShaderGlass-Bilinear-$V-win-x64.zip" *)
        unzip -l "ShaderGlass-Bilinear-$V-win-x64.zip"

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.ver.outputs.tag }}
        V: ${{ steps.ver.outputs.version }}
        REPO: ${{ github.repository }}
      run: |
        if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
          gh release create "$TAG" --repo "$REPO" --target "${{ github.sha }}" --title "ShaderGlass-Bilinear $V" --generate-notes
        fi
        # remove assets from older packaging
        for a in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
          [ "$a" != "ShaderGlass-Bilinear-$V-win-x64.zip" ] && gh release delete-asset "$TAG" "$a" --repo "$REPO" -y || true
        done
        gh release upload "$TAG" "ShaderGlass-Bilinear-$V-win-x64.zip" --clobber --repo "$REPO"
