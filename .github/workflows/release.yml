name: Release

# Builds ShaderGlass.exe on Windows and publishes it as a GitHub release.
# - Push to main that changes VERSION -> creates tag v<VERSION> + release with the build
# - Publishing a release manually       -> attaches the build to that release
# - "Run workflow" manually             -> attaches the build to the given tag
on:
  push:
    branches: [main]
    paths: [VERSION]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the build to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Determine tag
      id: tag
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "release") { $t = "${{ github.event.release.tag_name }}" }
        elseif ("${{ github.event_name }}" -eq "workflow_dispatch") { $t = "${{ inputs.tag }}" }
        else { $t = "v" + (Get-Content VERSION -Raw).Trim() }
        "tag=$t" >> $env:GITHUB_OUTPUT
        Write-Host "Tag: $t"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild /m /p:Configuration=Release /p:Platform=x64 ShaderGlass.sln

    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Copy-Item x64\Release\ShaderGlass.exe dist\
        Copy-Item LICENSE, README.md dist\
        Compress-Archive -Path dist\* -DestinationPath ShaderGlass-x64.zip

    - name: Publish release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        gh release view "$env:TAG" --repo "${{ github.repository }}" *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create "$env:TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$env:TAG" --generate-notes
        }
        gh release upload "$env:TAG" x64\Release\ShaderGlass.exe ShaderGlass-x64.zip --clobber --repo "${{ github.repository }}"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShaderGlass_x64_Release
        path: dist\
